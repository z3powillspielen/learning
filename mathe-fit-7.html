<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b4bdb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mathe-Fit 7">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235b4bdb'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle'%3E%F0%9F%A7%AE%3C/text%3E%3C/svg%3E">
<title>Mathe-Fit 7</title>
<style>
:root{--bg:#f4f2ff;--card:#fff;--ink:#1d1b33;--muted:#6b6890;--pri:#5b4bdb;--pri2:#8a5cf6;--ok:#15803d;--okbg:#e6f7ec;--bad:#c81e1e;--badbg:#fdecec;--warn:#b45309;--warnbg:#fff3dc;--line:#e4e0f5;--hint:#fff8d6;--hintline:#f0cf5a;--key:#ffffff;--shadow:0 2px 10px rgba(60,40,160,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#14132a;--card:#1f1d3a;--ink:#f1efff;--muted:#a9a5cf;--line:#34315a;--ok:#4ade80;--okbg:#12351f;--bad:#f87171;--badbg:#3b1717;--warn:#fbbf24;--warnbg:#3a2a0f;--hint:#353014;--hintline:#8a7a2a;--key:#2a2850;--shadow:0 2px 10px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);overscroll-behavior-y:contain;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,.topic,.key,.opt{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{-webkit-appearance:none;appearance:none}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#app{max-width:520px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh}
h1{font-size:1.5rem;margin:0;font-weight:900;line-height:1.2}
h2{font-size:1rem;margin:22px 0 10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.hero{display:flex;gap:14px;align-items:center;margin:6px 0 16px}
.hero .logo{font-size:2.4rem;width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:var(--shadow)}
.hero p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.lvrow{display:flex;align-items:center;gap:12px}
.lvbadge{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;font-weight:900;font-size:1.3rem;display:grid;place-items:center;flex:none}
.lvtxt{flex:1;display:flex;flex-direction:column}.lvtxt small{color:var(--muted)}
.stat{text-align:center;font-weight:900;font-size:1.1rem}.stat small{display:block;font-weight:600;font-size:.7rem;color:var(--muted)}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:99px;transition:width .5s}
.bar.thin{height:10px;margin:0;flex:1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);padding:5px;border-radius:14px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:10px 4px;border-radius:10px;font-weight:800;font-size:.95rem}
.seg button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.lvdesc{color:var(--muted);font-size:.9rem;margin:8px 2px 0}
.topics{display:grid;gap:10px}
.topic{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);transition:transform .1s}
.topic:active{transform:scale(.98)}
.topic .ic{font-size:1.7rem;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none}
.topic b{display:block;font-size:1.08rem}.topic small{color:var(--muted);display:block;line-height:1.3}
.topic .go{margin-left:auto;font-size:1.3rem;color:var(--muted)}
.ic.brueche{background:#ffe4e6}.ic.dreisatz{background:#dbeafe}.ic.sach{background:#dcfce7}.ic.mix{background:#fef3c7}
@media (prefers-color-scheme:dark){.ic.brueche{background:#4c1d2a}.ic.dreisatz{background:#1e3a5f}.ic.sach{background:#14402a}.ic.mix{background:#4a3a10}}
.badges{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.badge{text-align:center;font-size:.68rem;color:var(--muted);line-height:1.15}
.badge .bi{font-size:1.6rem;width:52px;height:52px;margin:0 auto 4px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--line)}
.badge.off .bi{filter:grayscale(1);opacity:.35}
.badge.on .bi{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.18)}
.badge.on{color:var(--ink);font-weight:700}
details.cheat{margin-top:22px}
details summary{font-weight:800;cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:' ▾';color:var(--muted)}
details[open] summary::after{content:' ▴'}
.rule{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.rule b{display:block;margin-bottom:2px}
.rule p{margin:2px 0;font-size:.95rem}
.link{display:block;margin:24px auto 0;background:none;border:0;color:var(--muted);font-size:.85rem;text-decoration:underline}
/* question */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.icon{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:1rem;flex:none}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-weight:900;font-size:.95rem;flex:none}
.pill.hot{background:#fff1e6;border-color:#fdba74;color:#c2410c}
@media (prefers-color-scheme:dark){.pill.hot{background:#43220f;color:#fdba74}}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);margin:6px 2px 10px;font-weight:700}
.tag{padding:3px 10px;border-radius:99px;font-weight:800;font-size:.78rem}
.tag.brueche{background:#ffe4e6;color:#9f1239}.tag.dreisatz{background:#dbeafe;color:#1e40af}.tag.sach{background:#dcfce7;color:#166534}
@media (prefers-color-scheme:dark){.tag.brueche{background:#4c1d2a;color:#fda4af}.tag.dreisatz{background:#1e3a5f;color:#93c5fd}.tag.sach{background:#14402a;color:#86efac}}
.qcard{font-size:1.08rem}
.qtext{font-weight:600}
.task{font-size:1.55rem;font-weight:800;text-align:center;margin:14px 0 4px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .12em;line-height:1.12;font-size:.9em}
.frac>span{padding:0 .18em;text-align:center}
.frac>span:first-child{border-bottom:2px solid currentColor}
.mixed{white-space:nowrap}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:1.02rem;font-weight:700;box-shadow:var(--shadow)}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.locked .opt,.locked .key,.locked .primary{pointer-events:none}
.locked .opt:not(.ok):not(.bad){opacity:.55}
#checkBtn{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));z-index:5}
@media (max-height:700px){.hero{margin:0 0 10px}.qcard{padding:12px}.task{margin:8px 0 2px}.keypad{gap:6px}.inhelp{margin:4px 0 6px}}
.dlg{position:fixed;inset:0;background:rgba(20,19,42,.55);display:grid;place-items:center;z-index:80;padding:20px}
.dlg>div{background:var(--card);border-radius:20px;padding:20px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.dlg p{margin:0 0 6px;font-weight:700}
.resume{width:100%;text-align:left;margin-bottom:14px;display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;border:2px solid var(--pri);background:var(--card);font-weight:800}
.locked .keypad,.locked #checkBtn,.locked .inhelp{display:none}
.ansbox{display:flex;align-items:center;gap:10px;margin-top:10px;background:var(--card);border:2px solid var(--pri);border-radius:16px;padding:6px 14px;min-height:clamp(54px,9dvh,72px)}
.ansbox.ok{border-color:var(--ok);background:var(--okbg)}
.ansbox.bad{border-color:var(--bad)}
.disp{flex:1;font-size:1.7rem;font-weight:800;text-align:center;min-height:1.5em;display:flex;align-items:center;justify-content:center}
.disp .ph{font-size:1rem;color:var(--muted);font-weight:600}
.unit{font-weight:800;color:var(--muted);font-size:1.1rem}
.inhelp{text-align:center;font-size:.8rem;color:var(--muted);margin:6px 0 8px}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{height:clamp(40px,7.4dvh,54px);border-radius:14px;border:1px solid var(--line);background:var(--key);font-size:1.4rem;font-weight:800;box-shadow:0 2px 0 var(--line)}
.key:active{transform:translateY(2px);box-shadow:none}
.key.fn{background:var(--line)}
.key.small{font-size:.85rem;line-height:1.1}
.key .slash{font-size:1.6rem}
.key.w3{grid-column:span 3}.key.w4{grid-column:span 4}
.primary{display:block;width:100%;margin-top:12px;padding:clamp(11px,2.2dvh,15px);border:0;border-radius:16px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:1.1rem;font-weight:900;box-shadow:0 4px 14px rgba(91,75,219,.35)}
.primary:active{transform:scale(.99)}
.secondary{display:block;width:100%;margin-top:10px;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:1.05rem;font-weight:800}
.hintbtn{display:block;width:100%;margin-top:12px;padding:13px;border-radius:16px;border:2px dashed var(--hintline);background:var(--hint);font-size:1.02rem;font-weight:800}
.hint{background:var(--hint);border-left:5px solid var(--hintline);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:.98rem;animation:pop .25s}
.hint>b{display:block;margin-bottom:4px}
.msg{margin-top:10px;padding:10px 14px;border-radius:12px;font-weight:700;font-size:.95rem;animation:pop .2s}
.msg.warn{background:var(--warnbg);color:var(--warn)}
.msg.bad{background:var(--badbg);color:var(--bad)}
.fb{margin-top:14px;padding:14px 16px;border-radius:16px;animation:pop .25s}
.fb.ok{background:var(--okbg);border:2px solid var(--ok)}
.fb.bad{background:var(--badbg);border:2px solid var(--bad)}
.fbh{font-weight:900;font-size:1.15rem;margin-bottom:6px}
.sol{margin-top:8px;font-size:.98rem}
.steps>div{padding:5px 0;border-bottom:1px dashed var(--line)}
.steps>div:last-child{border-bottom:0}
.steps .res{padding-top:8px}
table.ds{border-collapse:collapse;margin:8px auto;font-weight:700}
table.ds td{padding:3px 8px;text-align:center}
table.ds tr.op td{color:var(--pri);font-size:.85rem;font-weight:800}
@media (prefers-color-scheme:dark){table.ds tr.op td{color:#b9adff}}
table.vt{border-collapse:collapse;margin:12px auto 0;font-size:1.1rem}
table.vt th,table.vt td{border:2px solid var(--line);padding:7px 13px;text-align:center}
table.vt th{background:var(--line)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.xpfloat{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-weight:900;font-size:2rem;color:#f59e0b;pointer-events:none;animation:floatup 1.1s forwards;z-index:50;text-shadow:0 2px 8px rgba(0,0,0,.15)}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0) scale(.8)}to{opacity:0;transform:translate(-50%,-90px) scale(1.2)}}
#toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none}
.toast{background:#1d1b33;color:#fff;padding:10px 18px;border-radius:99px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .25s;max-width:90%}
.end{text-align:center;padding-top:20px}
.bigemo{font-size:4.5rem;animation:pop .4s}
.end p{color:var(--muted);margin:8px 6px 16px}
.endstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.endstats>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px}
.endstats b{display:block;font-size:1.25rem}.endstats small{color:var(--muted);font-size:.75rem}
.end .badges{grid-template-columns:repeat(auto-fit,minmax(70px,1fr))}
details.miss{text-align:left;margin-bottom:10px}
details.miss .qtext{margin-top:10px}
.endbtns{margin-top:20px}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:40;pointer-events:none;animation:fall linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<script>
// ===== LOGIC START =====
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;};
const lcm=(a,b)=>a/gcd(a,b)*b;
function F(n,d){if(d<0){n=-n;d=-d;}const g=gcd(n,d)||1;return{n:n/g,d:d/g};}
const nf=(x,money)=>x.toLocaleString('de-DE',money?{minimumFractionDigits:2,maximumFractionDigits:2}:{maximumFractionDigits:3});
const eur=c=>nf(c/100,true)+' €';
const fr=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
function showF(f){if(f.d===1)return nf(f.n);if(f.n>f.d){const w=Math.floor(f.n/f.d);return `<span class="mixed">${w}${fr(f.n-w*f.d,f.d)}</span>`;}return fr(f.n,f.d);}
const showImp=f=>f.d===1?nf(f.n):fr(f.n,f.d);
function showOp(o){if(o.int!=null)return String(o.int);if(o.w)return `<span class="mixed">${o.w}${fr(o.n,o.d)}</span>`;return fr(o.n,o.d);}
const toImp=o=>o.int!=null?{n:o.int,d:1}:{n:(o.w||0)*o.d+o.n,d:o.d};
const fv=o=>o.int!=null?o.int:(o.w||0)+o.n/o.d;
function rf(minD,maxD){let d,n;do{d=R(minD,maxD);n=R(1,d-1);}while(gcd(n,d)!==1);return{n,d};}
function rmixed(maxW,minD,maxD){const f=rf(minD,maxD);return{w:R(1,maxW),n:f.n,d:f.d};}
const convSteps=ops=>ops.filter(o=>o.w).map(o=>`Gemischte Zahl umwandeln: ${showOp(o)} = ${fr(`${o.w} · ${o.d} + ${o.n}`,o.d)} = ${fr(o.w*o.d+o.n,o.d)}`);
const intSteps=ops=>ops.filter(o=>o.int!=null).map(o=>`Ganze Zahl als Bruch schreiben: ${o.int} = ${fr(o.int,1)}`);
function finishSteps(raw){const r=F(raw.n,raw.d),s=[],g=gcd(raw.n,raw.d);
  if(g>1)s.push(`Kürzen durch ${g}: ${fr(raw.n,raw.d)} = ${showImp(r)}`);
  if(r.d!==1&&r.n>r.d)s.push(`Als gemischte Zahl: ${fr(r.n,r.d)} = ${showF(r)}`);
  return{r,s};}
const stepsHtml=a=>`<div class="steps">${a.map(s=>`<div>${s}</div>`).join('')}</div>`;

function fracQ(lead,expr,ans,hints,steps,chk){
  const imp=ans.d!==1&&ans.n>ans.d;
  return{topic:'brueche',type:'frac',key:expr,q:`${lead}<div class="task">${expr} = ?</div>`,ans,hints,
    sol:stepsHtml([`<b>${expr}</b>`,...steps,`<span class="res">Ergebnis: <b>${showF(ans)}</b>${imp?` &nbsp;(oder ${fr(ans.n,ans.d)})`:''}</span>`]),
    correctHtml:showF(ans)+(imp?` = ${fr(ans.n,ans.d)}`:''),_chk:chk};}

const crossOK=(a,b)=>gcd(a.n,b.d)>1||gcd(b.n,a.d)>1;
function genMul(lv){
  let ops;
  if(lv==='L'){ops=Math.random()<.55?[rf(2,6),rf(2,6)]:shuffle([rf(2,8),{int:R(2,6)}]);}
  else if(lv==='M'){
    if(Math.random()<.7){let a,b,t=0;do{a=rf(2,12);b=rf(2,12);t++;}while(!crossOK(a,b)&&t<80);ops=[a,b];}
    else{const a=rf(3,12);let k,t=0;do{k=R(2,12);t++;}while(gcd(k,a.d)===1&&t<50);ops=shuffle([a,{int:k}]);}
  } else {const t=Math.random();
    if(t<.45)ops=[rmixed(3,2,6),rmixed(2,2,6)];else if(t<.75)ops=shuffle([rmixed(3,2,8),rf(2,9)]);else ops=[rf(2,9),rf(2,9),rf(2,9)];}
  const im=ops.map(toImp);
  const raw={n:im.reduce((p,o)=>p*o.n,1),d:im.reduce((p,o)=>p*o.d,1)};
  const expr=ops.map(showOp).join(' · ');
  const pre=[...convSteps(ops),...intSteps(ops)];
  const prod=fr(im.map(o=>o.n).join(' · '),im.map(o=>o.d).join(' · '));
  const fin=finishSteps(raw);
  const hasM=ops.some(o=>o.w),hasI=ops.some(o=>o.int!=null);
  const h1=`<b>Bruch mal Bruch:</b> Zähler mal Zähler, Nenner mal Nenner.`+(hasM?` Gemischte Zahlen musst du <b>zuerst in unechte Brüche umwandeln</b> (Ganze · Nenner + Zähler).`:'')+(hasI?` Eine ganze Zahl kannst du als Bruch mit Nenner 1 schreiben, z.&nbsp;B. 3 = ${fr(3,1)}.`:'')+` <br>Profi-Trick: <b>vorher über Kreuz kürzen</b>, dann bleiben die Zahlen klein.`;
  const h2=`So geht's los:`+stepsHtml([...pre,`${prod} = ?`])+`Rechne aus und kürze am Ende vollständig.`;
  return fracQ('Berechne und kürze vollständig:',expr,F(raw.n,raw.d),[h1,h2],[...pre,`Zähler mal Zähler, Nenner mal Nenner: ${prod} = ${fr(raw.n,raw.d)}`,...fin.s],ops.reduce((p,o)=>p*fv(o),1));
}
function genDiv(lv){
  let ops;
  if(lv==='L'){ops=Math.random()<.5?[rf(2,8),{int:R(2,5)}]:[{int:R(2,6)},Math.random()<.5?{n:1,d:R(2,6)}:rf(2,5)];}
  else if(lv==='M'){const t=Math.random();
    if(t<.7){let a,b;do{a=rf(2,12);b=rf(2,12);}while(a.n===b.n&&a.d===b.d);ops=[a,b];}
    else if(t<.85)ops=[rf(2,12),{int:R(2,9)}];else ops=[{int:R(2,12)},rf(2,9)];}
  else{const t=Math.random();
    if(t<.4)ops=[rmixed(3,2,6),rmixed(2,2,6)];else if(t<.7)ops=[rmixed(4,2,8),rf(2,9)];else if(t<.85)ops=[rf(2,9),rmixed(2,2,6)];else ops=[{int:R(2,12)},rmixed(2,2,5)];}
  const x=toImp(ops[0]),y=toImp(ops[1]);
  const raw={n:x.n*y.d,d:x.d*y.n};
  const expr=`${showOp(ops[0])} : ${showOp(ops[1])}`;
  const pre=[...convSteps(ops),...intSteps(ops)];
  const kStep=`Mit dem Kehrwert malnehmen: ${fr(x.n,x.d)} : ${fr(y.n,y.d)} = ${fr(x.n,x.d)} · ${fr(y.d,y.n)}`;
  const fin=finishSteps(raw);
  const hasM=ops.some(o=>o.w),hasI=ops.some(o=>o.int!=null);

function fromPool(item,topic,key){
  if(item.fixed){const c=item.c!=null?item.c:0;return{topic,type:'mc',key,q:item.q,opts:item.o||TYPES,correct:c,correctHtml:(item.o||TYPES)[c],hints:item.h,sol:item.s};}
  return mcItem(topic,key,item.q,item.o,item.h,item.s);
}
function poolQ(pool,lv,used,topic,pref){
  const order={L:['L','M','S'],M:['M','L','S'],S:['S','M','L']}[lv];
  for(const l of order){const c=pool.map((it,i)=>[it,i]).filter(([it,i])=>it.lv.includes(l)&&!used.has(pref+i));if(c.length){const [it,i]=pick(c);return fromPool(it,topic,pref+i);}}
  const i=R(0,pool.length-1);return fromPool(pool[i],topic,pref+i);
}
function makeQ(tp,lv,used){
  const t=Math.random();
  if(tp==='brueche'){if(t<.35)return genMul(lv);if(t<.7)return genDiv(lv);if(t<.85)return genAdd(lv);return poolQ(BRUCH_MC,lv,used,'brueche','bmc');}
  if(tp==='dreisatz'){if(t<.65)return Math.random()<.5?genProp(lv):genAnti(lv);if(t<.8)return genTable(lv);return poolQ(DS_MC,lv,used,'dreisatz','dmc');}
  return poolQ(SACH,lv,used,'sach','sach');
}
function buildRound(topic,lv,n=10){
  const used=new Set(),out=[];
  const plan=topic==='mix'?shuffle(['brueche','brueche','brueche','brueche','dreisatz','dreisatz','dreisatz','sach','sach','sach']):Array(n).fill(topic);
  for(const tp of plan){let q,tries=0;do{q=makeQ(tp,lv,used);tries++;}while(used.has(q.key)&&tries<40);used.add(q.key);out.push(q);}
  return out;
}

function parseFrac(s){s=s.trim().replace(/\s+/g,' ');let m;
  if((m=s.match(/^(\d+) (\d+)\/(\d+)$/)))return{w:+m[1],n:+m[2],d:+m[3],kind:'mixed'};
  if((m=s.match(/^(\d+)\/(\d+)$/)))return{w:0,n:+m[1],d:+m[2],kind:'frac'};
  if((m=s.match(/^(\d+)$/)))return{w:+m[1],n:0,d:1,kind:'int'};
  return null;}
function checkFrac(p,ans){
  if(!p)return{st:'invalid'};
  if(p.d===0)return{st:'invalid',msg:'Der Nenner darf nicht 0 sein.'};
  const v=F(p.w*p.d+p.n,p.d);
  if(v.n!==ans.n||v.d!==ans.d)return{st:'wrong'};
  if(p.kind==='int')return{st:'ok'};
  if(p.kind==='frac'){
    if(p.d===1)return{st:'reduce',msg:'Richtig! Schreib das Ergebnis aber als ganze Zahl.'};
    if(gcd(p.n,p.d)>1)return{st:'reduce',msg:'Richtig gerechnet – aber noch nicht vollständig gekürzt! Teile Zähler und Nenner durch den größten gemeinsamen Teiler.'};
    return{st:'ok'};}
  if(p.w===0)return{st:'reduce',msg:'Schreib das bitte ohne „0“ vorne, einfach als Bruch.'};
  if(p.n===0)return{st:'reduce',msg:'Schreib das bitte einfach als ganze Zahl.'};
  if(p.n>=p.d)return{st:'reduce',msg:'Der Wert stimmt, aber bei einer gemischten Zahl muss der Bruchteil kleiner als 1 sein.'};
  if(gcd(p.n,p.d)>1)return{st:'reduce',msg:'Richtig – aber den Bruchteil noch kürzen!'};
  return{st:'ok'};}
function checkNum(s,ans){
  if(!/^\d+([.,]\d+)?$/.test(s.trim()))return{st:'invalid',msg:'Bitte nur eine Zahl eingeben, z. B. 12 oder 3,75.'};
  const v=parseFloat(s.trim().replace(',','.'));
  return Math.round(v*100)===Math.round(ans*100)?{st:'ok'}:{st:'wrong'};}

const BADGES=[
 {id:'first',i:'🎉',t:'Erste Runde',test:(S,G,e)=>e&&S.rounds>=1},
 {id:'s5',i:'🔥',t:'5er-Serie',test:(S,G)=>G&&G.streak>=5},
 {id:'s10',i:'⚡',t:'10er-Serie',test:(S,G)=>G&&G.streak>=10},
 {id:'perfect',i:'🏆',t:'10 von 10',test:(S,G,e)=>e&&G.right===G.qs.length},
 {id:'nohelp',i:'🧠',t:'Ohne Tipps 8+',test:(S,G,e)=>e&&G.hints===0&&G.right>=8},
 {id:'schwer',i:'💪',t:'Schwer 8+',test:(S,G,e)=>e&&G.lv==='S'&&G.right>=8},
 {id:'b50',i:'🍕',t:'50 Brüche',test:S=>S.cnt.brueche>=50},
 {id:'d50',i:'⚖️',t:'50 Dreisätze',test:S=>S.cnt.dreisatz>=50},
 {id:'sa25',i:'📖',t:'25 Sach­aufgaben',test:S=>S.cnt.sach>=25},
 {id:'lv5',i:'⭐',t:'Level 5',test:S=>levelInfo(S.xp).lv>=5},
];
const KEY='mathefit7_v1';
const defState=()=>({xp:0,badges:[],bestStreak:0,cnt:{brueche:0,dreisatz:0,sach:0},rounds:0,lv:'M'});
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s.xp==='number'){const d=defState();return Object.assign(d,s,{cnt:Object.assign(d.cnt,s.cnt||{})});}}catch(e){}return defState();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const RKEY='mathefit7_round';
let S=load(),G=null;
function saveRound(){try{if(G&&!G.ended)localStorage.setItem(RKEY,JSON.stringify(G));}catch(e){}}
function clearRound(){try{localStorage.removeItem(RKEY);}catch(e){}}
function loadRound(){try{const r=JSON.parse(localStorage.getItem(RKEY));if(r&&Array.isArray(r.qs)&&r.qs.length&&r.i>=0&&r.i<r.qs.length)return r;}catch(e){}return null;}
function ask(text,ok,cb){const d=document.createElement('div');d.className='dlg';
  d.innerHTML=`<div role="dialog" aria-modal="true"><p>${text}</p><button class="primary" data-d="y">${ok}</button><button class="secondary" data-d="n">Abbrechen</button></div>`;
  d.addEventListener('click',e=>{const a=e.target.dataset.d;if(a||e.target===d){d.remove();if(a==='y')cb();}});document.body.appendChild(d);}
const app=document.getElementById('app');
const $=id=>document.getElementById(id);

function toast(t){const el=document.createElement('div');el.className='toast';el.innerHTML=t;$('toasts').appendChild(el);setTimeout(()=>el.remove(),2800);}
function floatXP(n){const el=document.createElement('div');el.className='xpfloat';el.textContent='+'+n+' XP';document.body.appendChild(el);setTimeout(()=>el.remove(),1200);}
function confetti(){const cols=['#5b4bdb','#8a5cf6','#f59e0b','#22c55e','#ef4444','#06b6d4'];
  for(let i=0;i<70;i++){const c=document.createElement('div');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=pick(cols);c.style.animationDuration=(1.8+Math.random()*1.8)+'s';c.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4200);}}
function checkBadges(end){const got=[];for(const b of BADGES){if(!S.badges.includes(b.id)&&b.test(S,G,end)){S.badges.push(b.id);got.push(b);}}
  if(got.length){save();if(G)G.newB.push(...got);got.forEach(b=>toast(`${b.i} Neues Abzeichen: ${b.t}`));}}
const badgeHtml=(b,on)=>`<div class="badge ${on?'on':'off'}"><div class="bi">${b.i}</div>${b.t}</div>`;

function renderHome(){
  G=null;const pend=loadRound();const L=levelInfo(S.xp);
  const tp=(id,ic,sub)=>`<button class="topic" data-a="start" data-v="${id}"><div class="ic ${id}">${ic}</div><div><b>${TOPIC[id]}</b><small>${sub}</small></div><span class="go">›</span></button>`;
  app.innerHTML=`
  <div class="hero"><div class="logo">🧮</div><div><h1>Mathe-Fit 7</h1><p>Dein Training für die Mathearbeit</p></div></div>
  <div class="card"><div class="lvrow"><div class="lvbadge">${L.lv}</div><div class="lvtxt"><b>${L.name}</b><small>${S.xp} XP${L.max?' · Höchstes Level!':` · noch ${L.toNext} XP bis Level ${L.lv+1}`}</small></div><div class="stat">🔥 ${S.bestStreak}<small>Rekord-Serie</small></div></div><div class="bar"><div style="width:${L.pct}%"></div></div></div>
  ${pend?`<button class="resume" data-a="resume"><span style="font-size:1.6rem">▶️</span><span>Runde fortsetzen<br><small style="color:var(--muted);font-weight:600">${TOPIC[pend.topic]} · Aufgabe ${pend.i+1} von ${pend.qs.length}</small></span></button>`:''}
  <h2>Schwierigkeit</h2>
  <div class="seg">${['L','M','S'].map(l=>`<button data-a="lv" data-v="${l}" class="${S.lv===l?'on':''}">${{L:'Leicht',M:'Mittel',S:'Schwer'}[l]}</button>`).join('')}</div>
  <p class="lvdesc">${LVTXT[S.lv]}</p>
  <h2>Was willst du üben?</h2>
  <div class="topics">
   ${tp('brueche','🍕','Malnehmen, Teilen, Kürzen – und ein bisschen Plus/Minus')}
   ${tp('dreisatz','⚖️','Proportional & antiproportional rechnen und erkennen')}
   ${tp('sach','📖','Textaufgaben aus dem Alltag')}
   ${tp('mix','📝','Alles gemischt – wie in der echten Arbeit')}
  </div>
  <h2>Abzeichen (${S.badges.length}/${BADGES.length})</h2>
  <div class="badges">${BADGES.map(b=>badgeHtml(b,S.badges.includes(b.id))).join('')}</div>
  <details class="card cheat"><summary>📒 Spickzettel – die wichtigsten Regeln</summary>
   <div class="rule"><b>Proportional (je mehr – desto mehr)</b><p>Beide Seiten mit derselben Zahl mal oder geteilt. Tabelle: y : x immer gleich.</p><p>3 kg → 6 € &nbsp;|&nbsp; 1 kg → 2 € &nbsp;|&nbsp; 5 kg → 10 €</p></div>
   <div class="rule"><b>Antiproportional (je mehr – desto weniger)</b><p>Links mal → rechts geteilt (und umgekehrt). Tabelle: x · y immer gleich.</p><p>4 Maler → 6 Tage &nbsp;|&nbsp; 1 Maler → 24 Tage &nbsp;|&nbsp; 3 Maler → 8 Tage</p></div>
   <div class="rule"><b>Weder noch</b><p>Z.&nbsp;B. bei einer Grundgebühr: doppelte Menge, aber nicht doppelter Preis.</p></div>
   <div class="rule"><b>Brüche malnehmen</b><p>Zähler · Zähler, Nenner · Nenner. Vorher über Kreuz kürzen!</p><p>${fr(2,3)} · ${fr(9,4)} = ${fr('1 · 3','1 · 2')} = ${fr(3,2)} = ${showF({n:3,d:2})}</p></div>
   <div class="rule"><b>Durch einen Bruch teilen</b><p>Mit dem Kehrwert des zweiten Bruchs malnehmen.</p><p>${fr(3,4)} : ${fr(2,5)} = ${fr(3,4)} · ${fr(5,2)} = ${fr(15,8)} = ${showF({n:15,d:8})}</p></div>
   <div class="rule"><b>Gemischte Zahlen</b><p>Zuerst umwandeln: Ganze · Nenner + Zähler. &nbsp;${showOp({w:2,n:1,d:3})} = ${fr(7,3)}</p></div>
   <div class="rule"><b>Plus und Minus</b><p>Erst gleichnamig machen, dann nur die Zähler rechnen.</p><p>${fr(1,2)} + ${fr(1,3)} = ${fr(3,6)} + ${fr(2,6)} = ${fr(5,6)}</p></div>
   <div class="rule"><b>Ganze Zahlen</b><p>4 = ${fr(4,1)}. Kehrwert von 4 ist ${fr(1,4)}.</p></div>
  </details>
  <button class="link" data-a="reset">Fortschritt zurücksetzen</button>`;
}

function startRound(topic){G={topic,lv:S.lv,qs:buildRound(topic,S.lv),i:0,right:0,xp:0,streak:0,hints:0,newB:[],missed:[]};showQ();}
function resumeRound(){const r=loadRound();if(!r){renderHome();return;}G=r;if(curQ().done)next();else showQ();}
const curQ=()=>G&&G.qs[G.i];
function preview(s){
  if(!s)return '<span class="ph">Antwort eintippen</span>';
  let w='',rest=s;const sp=s.indexOf(' ');
  if(sp>=0){w=s.slice(0,sp);rest=s.slice(sp+1);}
  if(rest.includes('/')){const [n,d]=rest.split('/');return `<span class="mixed">${w}${fr(n||'&nbsp;',d||'&nbsp;')}</span>`;}
  if(sp>=0)return `<span class="mixed">${w}${fr(rest||'&nbsp;','&nbsp;')}</span>`;
  return s;
}
function keys(type){
  const k=(v,l,c='')=>`<button class="key ${c}" data-a="key" data-v="${v}">${l}</button>`;
  if(type==='frac')return[k('7','7'),k('8','8'),k('9','9'),k('del','⌫','fn'),k('4','4'),k('5','5'),k('6','6'),k('/','<span class="slash">/</span>','fn'),k('1','1'),k('2','2'),k('3','3'),k(' ','␣<br>Ganze','fn small'),k('clr','C','fn'),k('0','0','w3')].join('');
  return[k('7','7'),k('8','8'),k('9','9'),k('del','⌫','fn'),k('4','4'),k('5','5'),k('6','6'),k(',',',','fn'),k('1','1'),k('2','2'),k('3','3'),k('clr','C','fn'),k('0','0','w4')].join('');
}
function showQ(){
  const q=curQ();Object.assign(q,{hs:0,tries:0,done:false,inp:''});saveRound();
  const pct=G.i/G.qs.length*100;
  let body;
  if(q.type==='mc')body=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-a="mc" data-v="${i}">${o}</button>`).join('')}</div>`;
  else body=`<div class="ansbox" id="ansbox"><div class="disp" id="disp">${preview('')}</div>${q.unit?`<span class="unit">${q.unit}</span>`:''}</div>
   <div class="inhelp">${q.type==='frac'?'Bruch: 3 / 4 &nbsp;·&nbsp; Gemischte Zahl: 1 ␣ 3 / 4 &nbsp;·&nbsp; immer vollständig kürzen':'Kommazahlen mit Komma eingeben, z. B. 3,75'}</div>
   <div class="keypad">${keys(q.type)}</div><button class="primary" id="checkBtn" data-a="check">Prüfen</button>`;
  app.innerHTML=`<div class="qtop"><button class="icon" data-a="quit" aria-label="Runde beenden">✕</button><div class="bar thin"><div style="width:${pct}%"></div></div><div class="pill ${G.streak>=3?'hot':''}" id="streak">🔥 ${G.streak}</div></div>
   <div class="meta"><span>Aufgabe ${G.i+1} von ${G.qs.length}</span><span class="tag ${q.topic}">${TOPIC[q.topic]}</span></div>
   <div class="card qcard"><div class="qtext">${q.q}</div></div>
   <div id="body">${body}</div><div id="msg"></div><div id="hints"></div>
   <button class="hintbtn" id="hintBtn" data-a="hint">🤔 Weiß nicht weiter</button>
   <div id="fb"></div>`;
  window.scrollTo(0,0);
}
function msg(t,cls){$('msg').innerHTML=t?`<div class="msg ${cls}">${t}</div>`:'';}
function press(k){
  const q=curQ();if(!q||q.done||q.type==='mc')return;let s=q.inp;
  if(k==='del')s=s.slice(0,-1);
  else if(k==='clr')s='';
  else if(/^\d$/.test(k)){if(s.length<14)s+=k;}
  else if(k==='/'){if(q.type==='frac'&&/\d$/.test(s)&&!s.includes('/'))s+='/';}
  else if(k===' '){if(q.type==='frac'&&/\d$/.test(s)&&!s.includes(' ')&&!s.includes('/'))s+=' ';}
  else if(k===','){if(q.type==='num'&&/\d$/.test(s)&&!s.includes(','))s+=',';}
  q.inp=s;$('disp').innerHTML=preview(s);msg('');
}
function doCheck(){
  const q=curQ();if(!q||q.done)return;const s=q.inp.trim();
  if(!s){msg('Gib zuerst eine Antwort ein.','warn');return;}
  const res=q.type==='frac'?checkFrac(parseFrac(s),q.ans):checkNum(s,q.ans);
  if(res.st==='invalid'){msg(res.msg||'Das Format verstehe ich nicht. Beispiele: 3/4 oder 1 3/4','warn');return;}
  if(res.st==='reduce'){msg('✋ '+res.msg,'warn');return;}
  if(res.st==='ok'){$('ansbox').classList.add('ok');finish(true);return;}
  q.tries++;
  if(q.tries<2){msg('❌ Leider falsch. Versuch es noch einmal – oder hol dir einen Tipp!','bad');const b=$('ansbox');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake','bad');setTimeout(()=>b.classList.remove('bad'),600);q.inp='';$('disp').innerHTML=preview('');return;}
  $('ansbox').classList.add('bad');finish(false);
}
function doMC(i){
  const q=curQ();if(!q||q.done)return;const btns=document.querySelectorAll('.opt');
  btns[q.correct].classList.add('ok');if(+i!==q.correct)btns[+i].classList.add('bad');
  finish(+i===q.correct);
}
function doHint(){
  const q=curQ();if(!q||q.done)return;
  if(q.hs<2){q.hs++;G.hints++;$('hints').insertAdjacentHTML('beforeend',`<div class="hint"><b>💡 Tipp ${q.hs}</b><div>${q.hints[q.hs-1]}</div></div>`);
    $('hintBtn').textContent=q.hs===1?'💡 Noch ein Tipp':'👀 Lösung zeigen';
    $('hints').lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'});}
  else finish(false,true);
}
function finish(ok,revealed){
  const q=curQ();q.done=true;let gain=0;const before=levelInfo(S.xp).lv;
  if(ok){G.right++;G.streak++;gain=q.tries>0?5:(q.hs===0?10:q.hs===1?6:4);if(G.streak>=5)gain+=5;else if(G.streak>=3)gain+=3;
    S.cnt[q.topic]++;if(G.streak>S.bestStreak)S.bestStreak=G.streak;}
  else{G.streak=0;q.no=G.i+1;G.missed.push(q);}
  G.xp+=gain;S.xp+=gain;save();saveRound();
  $('body').classList.add('locked');$('hintBtn').style.display='none';msg('');
  const sp=$('streak');sp.textContent='🔥 '+G.streak;sp.classList.toggle('hot',G.streak>=3);
  const head=ok?pick(PRAISE)+(G.streak>=3?` ${G.streak} in Folge!`:''):(revealed?'Kein Problem – so geht\'s:':'Leider nicht richtig.');
  $('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><div class="fbh">${head}</div>${!ok?`<div>Richtige Antwort: <b>${q.correctHtml||(nf(q.ans,q.money)+' '+(q.unit||''))}</b></div>`:''}<div class="sol">${q.sol}</div></div>
   <button class="primary" data-a="next">${G.i+1<G.qs.length?'Weiter →':'Ergebnis ansehen 🏁'}</button>`;
  if(gain)floatXP(gain);
  if(levelInfo(S.xp).lv>before){toast(`⬆️ Level ${levelInfo(S.xp).lv}: ${levelInfo(S.xp).name}!`);confetti();}
  checkBadges(false);
  setTimeout(()=>$('fb')?.scrollIntoView({behavior:'smooth',block:'start'}),60);
}
function next(){if(!G||G.ended)return;if(G.i+1<G.qs.length){G.i++;showQ();}else endRound();}
function endRound(){
  G.ended=true;clearRound();S.rounds++;save();checkBadges(true);
  const n=G.qs.length,r=G.right,L=levelInfo(S.xp);
  const emo=r===n?'🏆':r>=8?'🌟':r>=5?'👍':'💪';
  const txt=r===n?'Perfekt! Du bist bereit für die Arbeit!':r>=8?'Richtig stark! Nur noch ein bisschen Feinschliff.':r>=5?'Gut gemacht! Schau dir unten deine Fehler an und übe weiter.':'Dranbleiben lohnt sich! Nutze den „Weiß nicht weiter“-Knopf – aus den Tipps lernst du am meisten.';
  app.innerHTML=`<div class="end"><div class="bigemo">${emo}</div><h1>${r} von ${n} richtig</h1><p>${txt}</p>
   <div class="endstats"><div><b>+${G.xp}</b><small>XP</small></div><div><b>${G.hints}</b><small>Tipps genutzt</small></div><div><b>Level ${L.lv}</b><small>${L.name}</small></div></div>
   <div class="bar"><div style="width:${L.pct}%"></div></div>
   ${G.newB.length?`<h2>Neue Abzeichen</h2><div class="badges">${G.newB.map(b=>badgeHtml(b,true)).join('')}</div>`:''}
   ${G.missed.length?`<h2>Deine Fehler zum Nachschauen</h2>${G.missed.map(q=>`<details class="card miss"><summary>Aufgabe ${q.no} · ${TOPIC[q.topic]}</summary><div class="qtext">${q.q}</div><div class="sol"><div>Richtige Antwort: <b>${q.correctHtml||(nf(q.ans,q.money)+' '+(q.unit||''))}</b></div>${q.sol}</div></details>`).join('')}`:''}
   <div class="endbtns"><button class="primary" data-a="again">Nochmal: ${TOPIC[G.topic]}</button><button class="secondary" data-a="home">Zur Übersicht</button></div></div>`;
  window.scrollTo(0,0);
  if(r>=8)confetti();
}
const ACT={
  lv:v=>{S.lv=v;save();renderHome();},
  start:v=>startRound(v),
  quit:()=>ask('Runde wirklich abbrechen? Deine XP bleiben erhalten.','Ja, abbrechen',()=>{clearRound();renderHome();}),resume:resumeRound,
  mc:v=>doMC(v),key:v=>press(v),check:doCheck,hint:doHint,next,
  home:renderHome,again:()=>startRound(G.topic),
  reset:()=>ask('Wirklich alle XP, Level und Abzeichen löschen?','Ja, alles löschen',()=>{S=defState();save();clearRound();renderHome();}),
};
app.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=ACT[el.dataset.a];if(f)f(el.dataset.v,el);});
document.addEventListener('keydown',e=>{
  const q=curQ();if(!q||G.ended)return;
  if(q.done){if(e.key==='Enter'){e.preventDefault();next();}return;}
  if(q.type==='mc'){const i=parseInt(e.key,10)-1;if(i>=0&&i<q.opts.length)doMC(i);return;}
  if(/^\d$/.test(e.key))press(e.key);
  else if(e.key==='/')press('/');
  else if(e.key===' '){e.preventDefault();press(' ');}
  else if(e.key===','||e.key==='.')press(',');
  else if(e.key==='Backspace'){e.preventDefault();press('del');}
  else if(e.key==='Enter'){e.preventDefault();doCheck();}
});
(function(){try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#5b4bdb');g.addColorStop(1,'#8a5cf6');x.fillStyle=g;x.fillRect(0,0,180,180);
  x.font='100px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🧮',90,98);
  const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l);}catch(e){}})();
renderHome();
</script>
</body>
</html>
